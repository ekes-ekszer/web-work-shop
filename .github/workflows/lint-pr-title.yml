name: Lint PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  semantic-pull-request:
    name: Semantic PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Load commit taxonomy
        id: taxonomy
        shell: bash
        run: |
          {
            echo 'types<<EOF'
            jq -r '.types[]' .github/taxonomy.json
            echo EOF
            echo 'scopes<<EOF'
            jq -r '.scopes[]' .github/taxonomy.json
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v6
        with:
          types: ${{ steps.taxonomy.outputs.types }}
          scopes: ${{ steps.taxonomy.outputs.scopes }}
          requireScope: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
